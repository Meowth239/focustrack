version: '3.8'

services:
  bot:
    build: .
    container_name: focustrack-bot
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - .:/app
    # For development: use host network, keep container running
    network_mode: host

  # Optional: database service if needed
  # db:
  #   image: postgres:15
  #   container_name: focustrack-db
  #   environment:
  #     POSTGRES_DB: focustrack
  #     POSTGRES_USER: user
  #     POSTGRES_PASSWORD: password
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #   networks:
  #     - focustrack

# volumes:
#   db_data:

networks:
  default:
    name: focustrack-network